[package]
name = "tdd-ratchet"
version = "1.0.3"
edition = "2024"
description = "Enforce strict TDD in Rust projects — new tests must fail before they can pass, verified by git history"
license = "MIT OR Apache-2.0"
repository = "https://github.com/maxeonyx/tdd-ratchet-rs"
readme = "README.md"

[[bin]]
name = "cargo-ratchet"
path = "src/main.rs"

[dependencies]
git2 = { version = "0.20", features = ["vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
help-test = { git = "https://github.com/maxeonyx/help-test", tag = "v0.1.0" }
jsonschema = "0.28"
tempfile = "3"
